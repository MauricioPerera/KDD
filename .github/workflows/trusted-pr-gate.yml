name: trusted-pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trusted-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Compare proposed merge with approved baseline
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_APPROVAL_REGISTRY: ${{ vars.KDD_APPROVAL_REGISTRY }}
        run: >-
          python scripts/guard_pr_baseline.py
          --pr-number "$PR_NUMBER"
          --base-ref "$BASE_SHA"
          --approval-registry "$KDD_APPROVAL_REGISTRY"
