name: deploy-pages

on:
  workflow_run:
    workflows: [validate-contracts]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'MauricioPerera/KDD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install pinned publisher
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund

      - name: Install pinned discovery parsers
        run: |
          python -m pip install --only-binary=:all: -r requirements-change-audit.txt

      - name: Install pinned context compatibility dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/context-v03/requirements.txt

      - name: Download Ubuntu CI inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kdd-ci-inventory-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-ubuntu-latest
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/kdd-ci-inventory/ubuntu-latest

      - name: Download Windows CI inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kdd-ci-inventory-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-windows-latest
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/kdd-ci-inventory/windows-latest

      - name: Verify Pages build contract
        run: |
          python -m unittest tests/test_pages_build.py
          python scripts/validate_contracts.py knowledge/contracts

      - name: Build and validate public bundle
        shell: bash
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_INVENTORY_DIR: ${{ runner.temp }}/kdd-ci-inventory
        run: |
          KDD_TRUSTED_RUNTIME_REF="$(python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def unique_object(pairs):
              fields = dict(pairs)
              if len(fields) != len(pairs):
                  raise ValueError('duplicate key in inventory manifest')
              return fields

          def read_runtime(directory):
              path = directory / 'inventory.json'
              if (directory.is_symlink() or path.is_symlink() or not path.is_file()
                      or path.resolve(strict=True).parent != directory):
                  raise ValueError('missing or unsafe inventory manifest: ' + directory.name)
              manifest = json.loads(path.read_text(encoding='utf-8'), object_pairs_hook=unique_object)
              runtime = manifest.get('trusted_runtime_ref') if isinstance(manifest, dict) else None
              if not isinstance(runtime, str) or not re.fullmatch(r'[0-9a-f]{40}', runtime):
                  raise ValueError('invalid inventory runtime: ' + directory.name)
              return runtime

          try:
              root = Path(os.environ['CI_INVENTORY_DIR']).resolve(strict=True)
              runtimes = {read_runtime(root / platform) for platform in ('ubuntu-latest', 'windows-latest')}
              if len(runtimes) != 1:
                  raise ValueError('CI inventory runtimes disagree')
          except (OSError, ValueError) as error:
              raise SystemExit('PAGES_CI_INVENTORY: ' + str(error))
          print(runtimes.pop())
          PY
          )"
          printf 'CI inventory runtime: %s\n' "$KDD_TRUSTED_RUNTIME_REF"
          python site/build.py --output "$RUNNER_TEMP/kdd-pages" --ci-run-url "$CI_RUN_URL" --ci-inventory-dir "$RUNNER_TEMP/kdd-ci-inventory" --ci-run-attempt "$CI_RUN_ATTEMPT" --ci-trusted-runtime-ref "$KDD_TRUSTED_RUNTIME_REF"

      - name: Finalize scoped Pages concepts
        shell: bash
        env:
          KDD_PAGES_FINALIZER_SHA256: 6f35ff3624969cb94985cebdfe934bda42ff1549e3ef1d2881a93265a8b92b19
        run: |
          python -I -c "import hashlib, os, pathlib, sys; body = pathlib.Path('scripts/finalize_pages_concepts.py').read_text(encoding='utf-8').encode('utf-8'); sys.exit(0 if hashlib.sha256(body).hexdigest() == os.environ['KDD_PAGES_FINALIZER_SHA256'] else 'Pages finalizer hash mismatch')"
          python -I scripts/finalize_pages_concepts.py --output "$RUNNER_TEMP/kdd-pages"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: upload_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/kdd-pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        timeout-minutes: 1
        env:
          KDD_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          KDD_PAGES_ARTIFACT_ID: ${{ steps.upload_pages.outputs.artifact_id }}
        with:
          script: |
            const {setTimeout: pause} = require('node:timers/promises');
            const {ACTIONS_RESULTS_URL, ACTIONS_RUNTIME_TOKEN, KDD_PAGES_ARTIFACT,
              KDD_PAGES_ARTIFACT_ID} = process.env;
            const validId = /^[1-9][0-9]*$/;
            if (!KDD_PAGES_ARTIFACT || !validId.test(KDD_PAGES_ARTIFACT_ID))
              throw new Error('Pages upload did not return an artifact name and ID');

            let endpoint;
            try {
              endpoint = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts',
                ACTIONS_RESULTS_URL);
            } catch {
              throw new Error('Invalid Actions Results endpoint');
            }
            if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password)
              throw new Error('Actions Results requires an HTTPS endpoint without embedded credentials');

            let scope;
            try {
              const payload = Buffer.from(ACTIONS_RUNTIME_TOKEN.split('.')[1], 'base64url');
              const scopes = JSON.parse(payload.toString('utf8')).scp.split(' ');
              const resultsScopes = scopes.filter(value => value.startsWith('Actions.Results:'));
              if (resultsScopes.length === 1)
                scope = /^Actions\.Results:([^:]+):([^:]+)$/.exec(resultsScopes[0]);
            } catch {
              throw new Error('Invalid Actions Results runtime token');
            }
            if (!scope) throw new Error('Missing or ambiguous Actions Results scope');
            const [, workflowRunBackendId, workflowJobRunBackendId] = scope;
            const signal = AbortSignal.timeout(30000);
            const request = {
              method: 'POST', redirect: 'error', signal,
              headers: {'Authorization': 'Bearer ' + ACTIONS_RUNTIME_TOKEN, 'Content-Type': 'application/json'},
              body: JSON.stringify({workflowRunBackendId, workflowJobRunBackendId}),
            };

            // Use the same job-scoped artifact list as deploy-pages.
            try {
              for (let checks = 1; ; checks++) {
                const response = await fetch(endpoint, request);
                if (!response.ok)
                  throw new Error('Actions Results lookup failed with HTTP ' + response.status);
                const result = await response.json().catch(() => {
                  throw new Error('Invalid Actions Results response');
                });
                const artifacts = result?.artifacts === undefined ? [] : result.artifacts;
                if (!result || typeof result !== 'object' || Array.isArray(result) ||
                    !Array.isArray(artifacts) || artifacts.some(item => typeof item?.name !== 'string'))
                  throw new Error('Invalid Actions Results response');

                const matches = artifacts.filter(item => item.name === KDD_PAGES_ARTIFACT);
                if (matches.length > 1) throw new Error('Duplicate Pages artifact name in Actions Results');
                if (matches.length === 1) {
                  const artifact = matches[0];
                  const hasJsonName = Object.hasOwn(artifact, 'databaseId');
                  if (hasJsonName && Object.hasOwn(artifact, 'database_id'))
                    throw new Error('Ambiguous artifact ID in Actions Results');
                  const idField = hasJsonName ? 'databaseId' : 'database_id';
                  const id = Object.hasOwn(artifact, idField) ? artifact[idField] : undefined;
                  if (!(typeof id === 'string' || Number.isSafeInteger(id)) ||
                      String(id) !== KDD_PAGES_ARTIFACT_ID)
                    throw new Error('Unexpected artifact ID in Actions Results');
                  signal.throwIfAborted();
                  core.info('Pages artifact ' + KDD_PAGES_ARTIFACT + ' (' + id + ') visible after ' +
                    checks + ' checks using ' + idField);
                  break;
                }
                await pause(1000, undefined, {signal});
              }
            } catch (error) {
              if (signal.aborted) throw new Error('Pages artifact lookup timed out after 30 s');
              throw error;
            }

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
