name: Windows post-init critical path
on:
  push:
    branches:
      - codex/postinit-manifest-compare
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Checkout measured SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: e07e404b4a8576f26cf9b6d3628f7ce5cd8ccaa8
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the measured Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.11.9
      - name: Select native Git on Windows
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import statistics
          import subprocess
          import time
          launcher = Path(shutil.which('git')).resolve()
          # Git for Windows 2.56 moved its native executable to ucrt64.
          # Older installations retain mingw64; both belong to this launcher.
          home = launcher.parent.parent
          candidates = [home / layout / 'bin' / 'git.exe' for layout in ('ucrt64', 'mingw64')]
          native = next((path for path in candidates if path.is_file()), launcher)
          version = subprocess.check_output([str(launcher), '--version'], text=True).strip()
          if subprocess.check_output([str(native), '--version'], text=True).strip() != version:
              raise SystemExit('FAIL: native Git must match the installed launcher version')
          startup = {}
          for label, executable in (('launcher', launcher), ('native', native)):
              samples = []
              for _ in range(7):
                  started = time.perf_counter()
                  subprocess.check_output([str(executable), '--version'])
                  samples.append(time.perf_counter() - started)
              startup[label] = {'median_seconds': statistics.median(samples), 'samples_seconds': samples}
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(native.parent) + '\n')
          print(json.dumps({'git_launcher': str(launcher), 'git_native': str(native), 'version': version, 'startup': startup}))
      - name: Install pinned change-audit parsers
        run: |
          python -m pip install --only-binary=:all: -r requirements-change-audit.txt
      - name: Install pinned context compatibility dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/context-v03/requirements.txt
      - name: Install pinned workflow checker
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'scripts/validate_workflows.py', 'install',
              '--cache-dir', str(Path(os.environ['RUNNER_TEMP']) / 'kdd-actionlint'),
              '--github-env', os.environ['GITHUB_ENV'],
              '--github-path', os.environ['GITHUB_PATH'],
          ], check=True)
      - name: Set up Node.js (for the multi-language example contract)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare pinned MCP SDK environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv
          root = Path.cwd().resolve()
          directory = Path(tempfile.mkdtemp(prefix='kdd-mcp-sdk-', dir=os.environ['RUNNER_TEMP'])).resolve()
          if directory.is_relative_to(root):
              raise SystemExit('FAIL: SDK environment must be outside the checkout')
          venv.EnvBuilder(with_pip=True).create(directory / 'venv')
          python = directory / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          platform = 'windows' if os.name == 'nt' else 'ubuntu'
          environment = dict(os.environ, PIP_CONFIG_FILE=os.devnull, PIP_INDEX_URL='https://pypi.org/simple',
                             PIP_EXTRA_INDEX_URL='', PIP_FIND_LINKS='', PIP_DISABLE_PIP_VERSION_CHECK='1')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:',
                          '--require-hashes', '--index-url', 'https://pypi.org/simple',
                          '-r', str(root / 'tools/mcp-sdk' / (platform + '.txt'))],
                         env=environment, check=True, timeout=300)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_MCP_SDK_PYTHON=' + python.as_posix() + '\n')
              output.write('KDD_MCP_SDK_REPORT=' + (directory / 'protocol-report.json').as_posix() + '\n')
      - name: Prepare native Windows test temp
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path.cwd().resolve(strict=True)
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if not base.is_dir() or base.is_relative_to(root) or any(c in str(base) for c in '\r\n'):
              raise SystemExit('RUNNER_TEMP must be an external directory')
          environment = dict(os.environ, LC_ALL='C')
          for name in ('GIT_DIR', 'GIT_WORK_TREE', 'GIT_COMMON_DIR', 'GIT_INDEX_FILE', 'GIT_CEILING_DIRECTORIES'):
              environment.pop(name, None)
          probe = subprocess.run(['git', '-C', str(base), 'rev-parse', '--is-inside-work-tree'],
                                 env=environment, capture_output=True)
          if probe.returncode != 128 or not probe.stderr.startswith(b'fatal: not a git repository'):
              raise SystemExit('RUNNER_TEMP must be outside Git; repository probe must succeed')
          directory = Path(tempfile.mkdtemp(prefix='kdd-native-tests-', dir=base)).resolve(strict=True)
          try:
              if directory.parent != base or directory.is_relative_to(root):
                  raise RuntimeError('Temporary directory escaped the reviewed location')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
                  output.write(''.join(name + '=' + directory.as_posix() + '\n' for name in ('TEMP', 'TMP', 'TMPDIR')))
          except BaseException:
              directory.rmdir()
              raise
          print('KDD_WINDOWS_TEMP ' + json.dumps({'runner_temp': base.as_posix(), 'test_temp': directory.as_posix()}))
      - name: Record Windows runner identity
        id: runner-identity
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kdd-resource-evidence'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          @{cpu=$env:PROCESSOR_IDENTIFIER; logical_cpus=[Environment]::ProcessorCount; image=$env:ImageVersion} |
            ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath (Join-Path $out 'environment.json')
      - name: Capture the ten-worker module timeline
        shell: pwsh
        run: python ../control/.github/diagnostics/postinit_timeline.py --source . --sha e07e404b4a8576f26cf9b6d3628f7ce5cd8ccaa8 --out (Join-Path $env:RUNNER_TEMP 'kdd-resource-evidence')
      - name: Upload diagnostic samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postinit-resource-samples
          path: ${{ runner.temp }}/kdd-resource-evidence
          if-no-files-found: warn
