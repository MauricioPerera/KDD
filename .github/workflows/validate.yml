name: validate-contracts

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Emit controlled A16 marker
        shell: bash
        run: printf '%s\n' 'KDD_A16_DECOY_VALIDATE_NO_SUITE'
  board:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Emit controlled A16 marker
        shell: bash
        run: printf '%s\n' 'KDD_A16_DECOY_BOARD_NO_SUITE'
