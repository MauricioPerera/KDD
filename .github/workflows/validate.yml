name: validate-contracts

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:
  # MODO 1 — Reusable workflow. When another repo calls this via `uses:`,
  # the `inputs.*` context below is populated (defaults apply too). When THIS
  # file fires on its native push/pull_request triggers, `inputs.*` is EMPTY,
  # so each job environment variable falls back to the literal default
  # embedded in the `${{ inputs.X || 'literal' }}` expression. That literal
  # MUST match its documented default. Approval references are selected below
  # from the external tree registry or explicit reusable inputs; legacy global
  # references are not fallback values.
  # Worker inputs are opt-in: callers default to serial execution; only native
  # runs of this repository use the reviewed parallel defaults below.
  workflow_call:
    inputs:
      reusable_execution:
        type: boolean
        default: true
      suite_workers:
        type: string
        default: '1'
      contract_workers:
        type: string
        default: '1'
      exclusive_contract_commands:
        type: string
        default: '[]'
      verify_mcp_sdk:
        type: boolean
        default: false
      contracts_dir:
        type: string
        default: 'knowledge/contracts'
      specs_dir:
        type: string
        default: 'specs'
      completion_policy_path:
        type: string
        default: 'completion-legacy.json'
      completion_workflow_path:
        type: string
        default: '.github/workflows/validate.yml'
      completion_workflow_name:
        type: string
        default: 'validate-contracts'
      okf_dir:
        type: string
        default: 'knowledge'
      rules_dir:
        type: string
        default: 'examples/rules'
      behavior_dir:
        type: string
        default: 'behavior'
      skills_dirs:
        type: string
        # validate_skills.py accepts multiple positional dirs; single input,
        # space-separated, so the expansion lands as two argv slots.
        default: 'skills .agents/skills'
      ux_page_dir:
        type: string
        default: 'examples/ux-page'
      diagrams_dir:
        type: string
        default: 'examples/diagrams'
      security_scan_dir:
        type: string
        default: 'security/scan'
      compliance_scan_dir:
        type: string
        default: 'compliance/scan'
      privacy_scan_dir:
        type: string
        default: 'privacy/scan'
      accessibility_scan_dir:
        type: string
        default: 'accessibility/scan'
      dependency_eol_scan_dir:
        type: string
        default: 'dependency-eol/scan'
      observability_scan_dir:
        type: string
        default: 'observability/scan'
      test_coverage_scan_dir:
        type: string
        default: 'test-coverage/scan'
      src_dir_secrets:
        type: string
        default: 'src'
      quality_policy_path:
        type: string
        default: 'quality.json'
      quality_require_oracle_reviews:
        type: boolean
        default: false
      quality_approved_ref:
        type: string
        default: ''
      approved_baseline_ref:
        type: string
        default: ''
      approval_registry:
        type: string
        default: ''
      trusted_runtime_ref:
        type: string
        default: ''
      change_contract_path:
        type: string
        default: ''
      acceptance_policy_path:
        type: string
        default: 'acceptance.json'
      acceptance_required:
        type: boolean
        default: false
      required_evidence:
        type: string
        default: ''

# Supersede native PR runs only. A caller owns its concurrency policy.
# A distinct namespace prevents a reusable call from cancelling its caller.
concurrency:
  group: kdd-validate-${{ github.workflow }}-${{ github.event_name == 'pull_request' && !inputs.reusable_execution && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.reusable_execution }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        role: [full]
        exclude: ${{ fromJSON(github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"os":"windows-latest"}]' || '[]') }}
    runs-on: ${{ matrix.os }}
    env: &validation_environment
      KDD_SUITE_WORKERS: ${{ inputs.suite_workers || (!inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' && (matrix.os == 'windows-latest' && '6' || '4') || '1') }}
      KDD_CONTRACT_WORKERS: ${{ inputs.contract_workers || (!inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' && '4' || '1') }}
      KDD_EXCLUSIVE_CONTRACT_COMMANDS: ${{ inputs.exclusive_contract_commands || (!inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' && matrix.os == 'windows-latest' && '["python -m unittest tests/test_init_project.py"]' || '[]') }}
      KDD_MCP_SDK_REQUIRED: ${{ (inputs.verify_mcp_sdk || (!inputs.reusable_execution && github.repository == 'MauricioPerera/KDD')) && '1' || '0' }}
      KDD_TRUSTED_RUNTIME_REF: ${{ inputs.trusted_runtime_ref || vars.KDD_TRUSTED_RUNTIME_REF || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      KDD_APPROVAL_REGISTRY: ${{ inputs.approval_registry || (!inputs.reusable_execution && vars.KDD_APPROVAL_REGISTRY || '') }}
      KDD_EXPLICIT_APPROVED_BASELINE_REF: ${{ inputs.approved_baseline_ref || '' }}
      KDD_EXPLICIT_QUALITY_APPROVED_REF: ${{ inputs.quality_approved_ref || '' }}
      KDD_CONTRACTS_DIR: ${{ inputs.contracts_dir || 'knowledge/contracts' }}
      KDD_SPECS_DIR: ${{ inputs.specs_dir || 'specs' }}
      KDD_COMPLETION_POLICY: ${{ inputs.completion_policy_path || 'completion-legacy.json' }}
      KDD_COMPLETION_WORKFLOW_PATH: ${{ inputs.completion_workflow_path || '.github/workflows/validate.yml' }}
      KDD_COMPLETION_WORKFLOW_NAME: ${{ inputs.completion_workflow_name || 'validate-contracts' }}
      KDD_OKF_DIR: ${{ inputs.okf_dir || 'knowledge' }}
      KDD_RULES_DIR: ${{ inputs.rules_dir || 'examples/rules' }}
      KDD_SKILLS_DIRS: ${{ inputs.skills_dirs || 'skills .agents/skills' }}
      KDD_UX_PAGE_DIR: ${{ inputs.ux_page_dir || 'examples/ux-page' }}
      KDD_DIAGRAMS_DIR: ${{ inputs.diagrams_dir || 'examples/diagrams' }}
      KDD_SECURITY_SCAN_DIR: ${{ inputs.security_scan_dir || 'security/scan' }}
      KDD_COMPLIANCE_SCAN_DIR: ${{ inputs.compliance_scan_dir || 'compliance/scan' }}
      KDD_PRIVACY_SCAN_DIR: ${{ inputs.privacy_scan_dir || 'privacy/scan' }}
      KDD_ACCESSIBILITY_SCAN_DIR: ${{ inputs.accessibility_scan_dir || 'accessibility/scan' }}
      KDD_DEPENDENCY_EOL_SCAN_DIR: ${{ inputs.dependency_eol_scan_dir || 'dependency-eol/scan' }}
      KDD_OBSERVABILITY_SCAN_DIR: ${{ inputs.observability_scan_dir || 'observability/scan' }}
      KDD_TEST_COVERAGE_SCAN_DIR: ${{ inputs.test_coverage_scan_dir || 'test-coverage/scan' }}
      KDD_SRC_DIR_SECRETS: ${{ inputs.src_dir_secrets || 'src' }}
      KDD_QUALITY_POLICY: ${{ inputs.quality_policy_path || 'quality.json' }}
      KDD_REQUIRED_EVIDENCE: ${{ inputs.required_evidence || '' }}
      KDD_QUALITY_REQUIRE_ORACLE_REVIEWS: ${{ inputs.quality_require_oracle_reviews && 'true' || 'false' }}
    steps: &validation_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        id: postinit-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: &validation_python
          python-version: '3.11'

      - name: Bind Windows post-init tools
        id: postinit-tools
        if: >-
          ${{ matrix.os == 'windows-latest' && github.repository == 'MauricioPerera/KDD' &&
          !inputs.reusable_execution && github.workflow_ref ==
          format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) &&
          (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref ==
          'refs/heads/main')) }}
        shell: C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command "& $env:KDD_POSTINIT_PYTHON -I -X utf8 '{0}'; exit $LASTEXITCODE"
        working-directory: ${{ runner.temp }}
        env:
          KDD_POSTINIT_PYTHON: ${{ steps.postinit-python.outputs.python-path }}
        run: |
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if Path.cwd().resolve().is_relative_to(root):
              raise SystemExit('post-init tool capture requires an external directory')
          paths = [Path(value) for value in os.environ['PATH'].split(os.pathsep)]
          path = os.pathsep.join(str(folder) for folder in paths if folder.is_absolute()
                               and not folder.resolve().is_relative_to(root))
          git, gh = (Path(shutil.which(name, path=path)).resolve(strict=True) for name in ('git', 'gh'))
          home = git.parent.parent
          options = [home / layout / 'bin/git.exe' for layout in ('ucrt64', 'mingw64')]
          git = next((candidate.resolve() for candidate in options if candidate.is_file()), git)
          if any(executable.is_relative_to(root) for executable in (git, gh)):
              raise SystemExit('post-init tools must be installed outside the checkout')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'git={git}\ngh={gh}\npath={path}\n')

      - name: Select approved references
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from approval_registry import ApprovalError, resolve
          required = {item.strip() for item in os.environ['KDD_REQUIRED_EVIDENCE'].split(',')}
          if os.environ.get('KDD_QUALITY_REQUIRE_ORACLE_REVIEWS') == 'true':
              required.add('quality')
          try:
              selected = resolve(
                  '.', 'HEAD', os.environ['KDD_APPROVAL_REGISTRY'],
                  explicit_baseline=os.environ['KDD_EXPLICIT_APPROVED_BASELINE_REF'],
                  explicit_quality=os.environ['KDD_EXPLICIT_QUALITY_APPROVED_REF'],
                  require_quality='quality' in required or Path(os.environ.get('KDD_QUALITY_POLICY', 'quality.json')).exists(),
              )
          except ApprovalError as error:
              raise SystemExit('FAIL: ' + str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_APPROVED_BASELINE_REF=' + selected['baseline_ref'] + '\n')
              output.write('KDD_ACCEPTANCE_APPROVED_REF=' + selected['baseline_ref'] + '\n')
              output.write('KDD_QUALITY_APPROVED_REF=' + (selected['quality_ref'] or '') + '\n')
          print(json.dumps(selected, sort_keys=True))

      - name: Select native Git on Windows
        if: ${{ runner.os == 'Windows' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import statistics
          import subprocess
          import time
          launcher = Path(shutil.which('git')).resolve()
          # Git for Windows 2.56 moved its native executable to ucrt64.
          # Older installations retain mingw64; both belong to this launcher.
          home = launcher.parent.parent
          candidates = [home / layout / 'bin' / 'git.exe' for layout in ('ucrt64', 'mingw64')]
          native = next((path for path in candidates if path.is_file()), launcher)
          version = subprocess.check_output([str(launcher), '--version'], text=True).strip()
          if subprocess.check_output([str(native), '--version'], text=True).strip() != version:
              raise SystemExit('FAIL: native Git must match the installed launcher version')
          startup = {}
          for label, executable in (('launcher', launcher), ('native', native)):
              samples = []
              for _ in range(7):
                  started = time.perf_counter()
                  subprocess.check_output([str(executable), '--version'])
                  samples.append(time.perf_counter() - started)
              startup[label] = {'median_seconds': statistics.median(samples), 'samples_seconds': samples}
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(native.parent) + '\n')
          print(json.dumps({'git_launcher': str(launcher), 'git_native': str(native), 'version': version, 'startup': startup}))

      - name: Materialize reviewed isolated CI runtime
        shell: python -I {0}
        run: &materialize_validation_runtime |
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          root = Path.cwd().resolve()
          ref = os.environ['KDD_TRUSTED_RUNTIME_REF']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
              raise SystemExit('FAIL: trusted runtime requires a reviewed full commit SHA')
          ref = ref.lower()
          if subprocess.check_output(['git', 'cat-file', '-t', ref]).strip() != b'commit':
              raise SystemExit('FAIL: trusted runtime must be a commit')
          temporary = Path(tempfile.mkdtemp(prefix='kdd-ci-runtime-', dir=os.environ['RUNNER_TEMP'])).resolve()
          if temporary.is_relative_to(root):
              raise SystemExit('FAIL: the trusted runtime must be outside the checkout')
          entry = temporary / 'trusted_ci.py'
          entry.write_bytes(subprocess.check_output(['git', 'show', ref + ':scripts/trusted_ci.py']))
          bundle = temporary / 'bundle'
          subprocess.run([
              sys.executable, '-I', str(entry), 'prepare', '--repo-root', str(root),
              '--trusted-ref', ref, '--bundle-dir', str(bundle),
          ], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_TRUSTED_BUNDLE=' + bundle.as_posix() + '\n')
          print('Trusted CI runtime: ' + ref)

      - name: Install pinned change-audit parsers
        run: |
          python -m pip install --only-binary=:all: -r requirements-change-audit.txt

      - name: Install pinned context compatibility dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/context-v03/requirements.txt

      - name: Check approved contract and oracle baseline
        shell: python
        env:
          KDD_CONTRACTS_DIR: ${{ inputs.contracts_dir || 'knowledge/contracts' }}
        run: |
          import os
          import subprocess
          import sys
          approved = os.environ['KDD_APPROVED_BASELINE_REF']
          if not approved:
              raise SystemExit('FAIL: an approved baseline reference is required')
          raise SystemExit(subprocess.call([
              sys.executable, 'scripts/validate_baseline.py', '--all',
              '--approved-ref', approved,
              '--contracts-dir', os.environ['KDD_CONTRACTS_DIR'],
          ]))

      - name: Install pinned workflow checker
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'scripts/validate_workflows.py', 'install',
              '--cache-dir', str(Path(os.environ['RUNNER_TEMP']) / 'kdd-actionlint'),
              '--github-env', os.environ['GITHUB_ENV'],
              '--github-path', os.environ['GITHUB_PATH'],
          ], check=True)

      - name: Validate all GitHub Actions workflows
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'scripts/validate_workflows.py', 'check',
              '--repo-root', '.', '--actionlint', os.environ['KDD_ACTIONLINT_BINARY'],
          ], check=True)

      - name: Check required optional evidence
        run: python scripts/optional_evidence.py check --layers security,compliance,privacy,accessibility,dependency-eol,observability,test-coverage,quality

      - name: Set up Node.js (for the multi-language example contract)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install board dependencies for contract oracles (when present)
        if: ${{ hashFiles('tools/kdd-board/package-lock.json') != '' }}
        run: npm ci --ignore-scripts
        working-directory: tools/kdd-board

      - name: Prepare pinned MCP SDK environment
        if: ${{ env.KDD_MCP_SDK_REQUIRED == '1' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv
          root = Path.cwd().resolve()
          directory = Path(tempfile.mkdtemp(prefix='kdd-mcp-sdk-', dir=os.environ['RUNNER_TEMP'])).resolve()
          if directory.is_relative_to(root):
              raise SystemExit('FAIL: SDK environment must be outside the checkout')
          venv.EnvBuilder(with_pip=True).create(directory / 'venv')
          python = directory / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          platform = 'windows' if os.name == 'nt' else 'ubuntu'
          environment = dict(os.environ, PIP_CONFIG_FILE=os.devnull, PIP_INDEX_URL='https://pypi.org/simple',
                             PIP_EXTRA_INDEX_URL='', PIP_FIND_LINKS='', PIP_DISABLE_PIP_VERSION_CHECK='1')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:',
                          '--require-hashes', '--index-url', 'https://pypi.org/simple',
                          '-r', str(root / 'tools/mcp-sdk' / (platform + '.txt'))],
                         env=environment, check=True, timeout=300)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_MCP_SDK_PYTHON=' + python.as_posix() + '\n')
              output.write('KDD_MCP_SDK_REPORT=' + (directory / 'protocol-report.json').as_posix() + '\n')

      - name: Run required MCP SDK protocol smoke
        if: ${{ env.KDD_MCP_SDK_REQUIRED == '1' }}
        shell: python
        run: |
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('reviewed_process_tree', Path(os.environ['KDD_TRUSTED_BUNDLE']) / 'process_tree.py')
          process_tree = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(process_tree)
          result = process_tree.run([os.environ['KDD_MCP_SDK_PYTHON'], '-I', 'scripts/check_mcp_sdk.py',
                                     '--repo-root', '.', '--report-json', os.environ['KDD_MCP_SDK_REPORT'],
                                     '--expected-commit', os.environ['GITHUB_SHA']], cwd=Path.cwd(), timeout=120)
          if result.returncode:
              raise SystemExit(result.returncode)
          data = json.loads(Path(os.environ['KDD_MCP_SDK_REPORT']).read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('MCP SDK ' + data['sdk_version'] + ': PASS, 8 protocol cases, 0 SKIP (in-memory).\n')

      - name: Prepare native Windows test temp
        if: ${{ github.repository == 'MauricioPerera/KDD' && matrix.os == 'windows-latest' && !inputs.reusable_execution }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path.cwd().resolve(strict=True)
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if not base.is_dir() or base.is_relative_to(root) or any(c in str(base) for c in '\r\n'):
              raise SystemExit('RUNNER_TEMP must be an external directory')
          environment = dict(os.environ, LC_ALL='C')
          for name in ('GIT_DIR', 'GIT_WORK_TREE', 'GIT_COMMON_DIR', 'GIT_INDEX_FILE', 'GIT_CEILING_DIRECTORIES'):
              environment.pop(name, None)
          probe = subprocess.run(['git', '-C', str(base), 'rev-parse', '--is-inside-work-tree'],
                                 env=environment, capture_output=True)
          if probe.returncode != 128 or not probe.stderr.startswith(b'fatal: not a git repository'):
              raise SystemExit('RUNNER_TEMP must be outside Git; repository probe must succeed')
          directory = Path(tempfile.mkdtemp(prefix='kdd-native-tests-', dir=base)).resolve(strict=True)
          try:
              if directory.parent != base or directory.is_relative_to(root):
                  raise RuntimeError('Temporary directory escaped the reviewed location')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
                  output.write(''.join(name + '=' + directory.as_posix() + '\n' for name in ('TEMP', 'TMP', 'TMPDIR')))
          except BaseException:
              directory.rmdir()
              raise
          print('KDD_WINDOWS_TEMP ' + json.dumps({'runner_temp': base.as_posix(), 'test_temp': directory.as_posix()}))

      - name: Validate contracts
        shell: bash
        run: python scripts/validate_contracts.py "$KDD_CONTRACTS_DIR"

      - name: Execute normative documentation examples
        run: python scripts/validate_documentation_examples.py

      - name: Audit changed Python budgets
        if: ${{ !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: python
        env:
          KDD_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          KDD_BUDGET_HEAD_REF: ${{ github.sha }}
        run: |
          import os
          import subprocess
          import sys
          expected = os.environ['KDD_BUDGET_HEAD_REF']
          actual = subprocess.check_output(['git', 'rev-parse', '--verify', 'HEAD']).decode('ascii').strip()
          if actual != expected:
              raise SystemExit('BUDGET_REF: checkout does not match the CI commit')
          raise SystemExit(subprocess.call([
              sys.executable, 'scripts/validate_changed_budgets.py',
              os.environ['KDD_CONTRACTS_DIR'], '--repo-root', '.',
              '--base-ref', os.environ['KDD_BUDGET_BASE_REF'], '--head-ref', expected]))

      - name: Audit implementation diff against approved contract (when configured)
        shell: bash
        env:
          KDD_CHANGE_CONTRACT: ${{ inputs.change_contract_path || '' }}
          KDD_CHANGE_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$KDD_CHANGE_CONTRACT" ]; then
            echo "SKIP: no change contract configured"
            exit 0
          fi
          python scripts/validate_change_contract.py \
            --contract "$KDD_CHANGE_CONTRACT" \
            --base-ref "$KDD_APPROVED_BASELINE_REF" \
            --head-ref "$KDD_CHANGE_HEAD_REF"

      - name: "Validate specs contracts"
        shell: bash
        run: python scripts/validate_specs.py "$KDD_SPECS_DIR"

      - name: Validate project completion evidence
        shell: bash
        env:
          KDD_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/validate_completion.py
          --specs-dir "$KDD_SPECS_DIR"
          --policy "$KDD_COMPLETION_POLICY"
          --repository "$KDD_REPOSITORY"

      - name: Verify prior completed CI run for project closure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KDD_REPOSITORY: ${{ github.repository }}
          KDD_CURRENT_RUN_ID: ${{ github.run_id }}
          KDD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: >-
          python scripts/verify_completion_runs.py
          --repository "$KDD_REPOSITORY"
          --current-run-id "$KDD_CURRENT_RUN_ID"
          --candidate-sha "$KDD_CANDIDATE_SHA"
          --base-sha "$KDD_BASE_SHA"
          --workflow-path "$KDD_COMPLETION_WORKFLOW_PATH"
          --workflow-name "$KDD_COMPLETION_WORKFLOW_NAME"
          --policy "$KDD_COMPLETION_POLICY"
          --specs-dir "$KDD_SPECS_DIR"

      - name: Validate OKF nodes
        shell: bash
        run: python scripts/validate_okf.py "$KDD_OKF_DIR"

      - name: Lint ASCII scripts
        run: python scripts/lint_ascii.py scripts

      - name: Validate Git task snapshots and transitions
        shell: python
        env:
          KDD_TASK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          import os
          import subprocess
          import sys
          base = os.environ['KDD_TASK_BASE_REF']
          command = [sys.executable, 'scripts/validate_tasks.py', '--head-ref', 'HEAD']
          if base and set(base) != {'0'}:
              command += ['--base-ref', base]
          raise SystemExit(subprocess.call(command))

      - name: Validate rule contracts
        shell: bash
        run: python scripts/validate_rules.py "$KDD_RULES_DIR"

      - name: Validate behavior contracts (optional)
        shell: bash
        env:
          KDD_BEHAVIOR_DIR: ${{ inputs.behavior_dir || 'behavior' }}
        run: python scripts/validate_behavior.py "$KDD_BEHAVIOR_DIR"

      - name: Validate agent skills
        shell: bash
        run: |
          read -r -a skill_dirs <<< "$KDD_SKILLS_DIRS"
          python scripts/validate_skills.py "${skill_dirs[@]}"

      - name: Validate changelog coherence
        run: python scripts/validate_changelog.py

      - name: Validate UX/accessibility (HTML pages)
        shell: bash
        run: python scripts/validate_ux_page.py "$KDD_UX_PAGE_DIR"

      - name: Validate Mermaid diagrams (flowchart)
        shell: bash
        run: python scripts/validate_diagrams.py "$KDD_DIAGRAMS_DIR"

      - name: Validate security findings (Capa 3, vendored codex-security)
        id: security_scan
        shell: bash
        run: python scripts/validate_security_findings.py "$KDD_SECURITY_SCAN_DIR"

      - name: Validate compliance/license findings (Capa 3)
        id: compliance_scan
        shell: bash
        run: python scripts/validate_compliance_findings.py "$KDD_COMPLIANCE_SCAN_DIR"

      - name: Validate privacy/PII findings (Capa 3)
        id: privacy_scan
        shell: bash
        run: python scripts/validate_privacy_findings.py "$KDD_PRIVACY_SCAN_DIR"

      - name: Validate accessibility findings (Capa 3)
        id: accessibility_scan
        shell: bash
        run: python scripts/validate_accessibility_findings.py "$KDD_ACCESSIBILITY_SCAN_DIR"

      - name: Validate dependency EOL findings (Capa 3)
        id: dependency_eol_scan
        shell: bash
        run: python scripts/validate_dependency_eol_findings.py "$KDD_DEPENDENCY_EOL_SCAN_DIR"

      - name: Validate observability findings (Capa 3)
        id: observability_scan
        shell: bash
        run: python scripts/validate_observability_findings.py "$KDD_OBSERVABILITY_SCAN_DIR"

      - name: Validate test-coverage findings (Capa 3)
        id: test_coverage_scan
        shell: bash
        run: python scripts/validate_test_coverage_findings.py "$KDD_TEST_COVERAGE_SCAN_DIR"

      # The template has a sealed board oracle as well as Python contracts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: hashFiles('tools/kdd-board/package-lock.json') != ''
        with:
          node-version: '24'
      - name: Install board oracle dependencies
        if: hashFiles('tools/kdd-board/package-lock.json') != ''
        run: npm ci --ignore-scripts
        working-directory: tools/kdd-board
      - name: Install pinned Pages publisher for PR
        if: ${{ matrix.role != 'win_contracts' && github.event_name == 'pull_request' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund

      - name: Validate Pages discovery with deployment dependencies
        if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: python scripts/pages_pr_discovery.py --repo-root . --venv-dir "$RUNNER_TEMP/kdd-pages-discovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Build and validate Pages for PR
        if: ${{ matrix.role != 'win_contracts' && github.event_name == 'pull_request' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python site/build.py --output "$RUNNER_TEMP/kdd-pages-pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_OS" --ci-run-url "$CI_RUN_URL"

      - name: Finalize scoped Pages concepts for PR
        if: ${{ matrix.role != 'win_contracts' && github.event_name == 'pull_request' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        env:
          KDD_PAGES_FINALIZER_SHA256: 6f35ff3624969cb94985cebdfe934bda42ff1549e3ef1d2881a93265a8b92b19
        run: |
          python -I -c "import hashlib, os, pathlib, sys; body = pathlib.Path('scripts/finalize_pages_concepts.py').read_text(encoding='utf-8').encode('utf-8'); sys.exit(0 if hashlib.sha256(body).hexdigest() == os.environ['KDD_PAGES_FINALIZER_SHA256'] else 'Pages finalizer hash mismatch')"
          python -I scripts/finalize_pages_concepts.py --output "$RUNNER_TEMP/kdd-pages-pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_OS"

      - name: Run each contract's test_command
        if: ${{ matrix.role != 'win_suite' }}
        shell: bash
        env:
          KDD_SKIP_INIT_POST_APPLY_SUITE: >-
            ${{ matrix.os == 'windows-latest' && github.repository == 'MauricioPerera/KDD' &&
            !inputs.reusable_execution && github.workflow_ref ==
            format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) &&
            (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref ==
            'refs/heads/main')) && '1' || '' }}
          KDD_OBSERVE_POSTINIT: >-
            ${{ github.repository == 'MauricioPerera/KDD' &&
            matrix.os == 'windows-latest' && !inputs.reusable_execution &&
            github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            github.workflow_ref == 'MauricioPerera/KDD/.github/workflows/validate.yml@refs/heads/main' && '1' || '' }}
        # init-project also runs the post-initialization suite; allow slow Windows runners.
        run: python -I "$KDD_TRUSTED_BUNDLE/trusted_ci.py" commands --repo-root . --contracts-dir "$KDD_CONTRACTS_DIR" --timeout 600 --deduplicate --workers "$KDD_CONTRACT_WORKERS" --report-dir "$RUNNER_TEMP/kdd-command-reports" --exclusive-commands-json "$KDD_EXCLUSIVE_CONTRACT_COMMANDS"

      - name: Report init command duration
        id: init-command-timing
        if: ${{ matrix.role != 'win_suite' && always() && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path
          reports = list((Path(os.environ['RUNNER_TEMP']) / 'kdd-command-reports').glob('evidence-*.json'))
          if len(reports) != 1:
              raise SystemExit('INIT_TIMING: expected one command report')
          data = json.loads(reports[0].read_text(encoding='utf-8'))
          runtime = os.environ['KDD_TRUSTED_RUNTIME_REF']
          if (not isinstance(data, dict) or type(data.get('version')) is not int
                  or data['version'] != 1 or data.get('trusted_runtime_ref') != runtime
                  or not isinstance(data.get('results'), list)):
              raise SystemExit('INIT_TIMING: invalid report or runtime')
          contract = 'knowledge/contracts/init-project.md'
          expected = Path(contract).resolve()
          matches = [row for row in data['results'] if isinstance(row, dict)
                     and isinstance(row.get('path'), str) and Path(row['path']).resolve() == expected]
          if len(matches) != 1:
              raise SystemExit('INIT_TIMING: expected one init result')
          row = matches[0]
          duration, ok, code, error = (row.get(key) for key in ('duration_seconds', 'ok', 'exit_code', 'error'))
          if (row.get('scope') != 'infrastructure'
                  or row.get('test_command') != 'python -m unittest tests/test_init_project.py'
                  or row.get('shared_from') is not None
                  or type(duration) not in (int, float) or not math.isfinite(duration) or duration < 0
                  or type(ok) is not bool or (code is not None and type(code) is not int)
                  or (error is not None and not isinstance(error, str))
                  or (ok and (code != 0 or error is not None))
                  or (not ok and code == 0 and error is None)):
              raise SystemExit('INIT_TIMING: invalid init outcome')
          summary = dict(schema_version=1, run_id=os.environ['GITHUB_RUN_ID'],
                         run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], head_sha=os.environ['GITHUB_SHA'],
                         trusted_runtime_ref=runtime, contract=contract, duration_seconds=duration,
                         ok=ok, exit_code=code, error=error)
          print('KDD_INIT_TIMING ' + json.dumps(summary, allow_nan=False, sort_keys=True))
          if output_path := os.environ.get('GITHUB_OUTPUT'):
              with open(output_path, 'a', encoding='utf-8', newline='\n') as output:
                  timed_out = not ok and error == 'timeout' and code is None
                  output.write('init_timed_out=' + str(timed_out).lower() + '\n')

      - name: Collect Windows post-init progress
        id: postinit-observation
        if: >-
          ${{ always() && github.repository == 'MauricioPerera/KDD' &&
          matrix.os == 'windows-latest' && !inputs.reusable_execution &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'MauricioPerera/KDD/.github/workflows/validate.yml@refs/heads/main' &&
          steps.init-command-timing.outputs.init_timed_out == 'true' }}
        shell: bash
        run: python -I scripts/postinit_timeout_observation.py --ci-output

      - name: Upload Windows post-init progress
        if: ${{ always() && steps.postinit-observation.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-postinit-progress-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest
          path: ${{ runner.temp }}/kdd-postinit-progress.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Scan for leaked secrets (src only — see knowledge/contracts/secret-scan-gate.md)
        shell: bash
        run: python scripts/scan_secrets.py "$KDD_SRC_DIR_SECRETS"

      - name: Prepare Python suite coverage
        if: ${{ matrix.role != 'win_contracts' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/ci-coverage/requirements.txt
          python -m venv "$RUNNER_TEMP/kdd-coverage-probe"
          if [ "$RUNNER_OS" = "Windows" ]; then
            probe_python="$RUNNER_TEMP/kdd-coverage-probe/Scripts/python.exe"
          else
            probe_python="$RUNNER_TEMP/kdd-coverage-probe/bin/python"
          fi
          "$probe_python" -m pip install --require-hashes --only-binary=:all: -r tools/ci-coverage/requirements.txt
          "$probe_python" -I tests/coverage_isolated_probe.py
          python scripts/ci_coverage.py prepare --repo-root . --output "$RUNNER_TEMP/kdd-python-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # The suite runs twice on purpose (identical command): the second run
      # detects flaky tests / verifies determinism. See specs/CONTRACT-11-ci-windows-suite2x.md.
      - name: Compute independent Windows suite inventory
        id: windows-suite-inventory
        if: ${{ matrix.role == 'win_suite' }}
        shell: bash
        run: |
          python -I site/ci_inventory.py discover --repo-root . |
            python -I -c 'import hashlib,json,sys; print("sha256=" + hashlib.sha256(("\n".join(json.load(sys.stdin))+"\n").encode("utf-8")).hexdigest())' >> "$GITHUB_OUTPUT"

      - name: Run unit tests (1/2)
        if: ${{ matrix.role != 'win_contracts' }}
        shell: bash
        env:
          KDD_SKIP_INIT_POST_APPLY_SUITE: '1'
          COVERAGE_PROCESS_START: ${{ (!inputs.reusable_execution && github.repository == 'MauricioPerera/KDD') && format('{0}/kdd-python-coverage-{1}-{2}/coverage.ini', runner.temp, github.run_id, github.run_attempt) || '' }}
        run: python -I "$KDD_TRUSTED_BUNDLE/trusted_ci.py" suite --repo-root . --start-directory tests --pattern "test_*.py" --workers "$KDD_SUITE_WORKERS" --report-dir "$RUNNER_TEMP/kdd-suite-reports"

      - name: Run unit tests (2/2)
        if: ${{ matrix.role != 'win_contracts' }}
        shell: bash
        env:
          KDD_SKIP_INIT_POST_APPLY_SUITE: '1'
        run: python -I "$KDD_TRUSTED_BUNDLE/trusted_ci.py" suite --repo-root . --start-directory tests --pattern "test_*.py" --workers "$KDD_SUITE_WORKERS" --report-dir "$RUNNER_TEMP/kdd-suite-reports"

      - name: Report Python suite coverage
        if: ${{ matrix.role != 'win_contracts' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          python scripts/ci_coverage.py report --repo-root . --output "$RUNNER_TEMP/kdd-python-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --platform "${{ matrix.os }}"

      - name: Upload Python suite coverage
        id: suite-coverage
        if: ${{ matrix.role != 'win_contracts' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/kdd-python-coverage-${{ github.run_id }}-${{ github.run_attempt }}/coverage.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Verify Windows post-init partitions
        if: ${{ matrix.role != 'win_contracts' && matrix.os == 'windows-latest' && github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        shell: C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command "& $env:KDD_POSTINIT_PYTHON -I -X utf8 '{0}'; exit $LASTEXITCODE"
        env:
          KDD_POSTINIT_PYTHON: ${{ steps.postinit-python.outputs.python-path }}
          KDD_POSTINIT_DRIVER_SHA256: '1b0fbea9cd310256f84c694b7d335602be10bc0377a29b007d919ddd62a7d05d'
          KDD_POSTINIT_GIT: ${{ steps.postinit-tools.outputs.git }}
          KDD_POSTINIT_GH: ${{ steps.postinit-tools.outputs.gh }}
          KDD_POSTINIT_TOOL_PATH: ${{ steps.postinit-tools.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if base.is_relative_to(Path.cwd().resolve()):
              raise SystemExit('post-init driver needs an external temporary directory')
          root = Path.cwd().resolve()
          git = Path(os.environ['KDD_POSTINIT_GIT'])
          if not git.is_absolute() or git.resolve().is_relative_to(root):
              raise SystemExit('post-init requires the bound Git')
          tool_env = {key: os.environ[key] for key in ('SYSTEMROOT', 'WINDIR', 'TMP', 'TEMP')
                      if key in os.environ}
          tool_env.update(PATH=os.environ['KDD_POSTINIT_TOOL_PATH'],
                          GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM='1')
          with tempfile.TemporaryDirectory(prefix='kdd-postinit-driver-', dir=base) as directory:
              driver = subprocess.check_output([str(git), '-C', str(root), '--no-replace-objects',
                                                'show', 'HEAD:scripts/ci_postinit_shards.py'],
                                               cwd=directory, env=tool_env, timeout=30)
              if hashlib.sha256(driver).hexdigest() != os.environ['KDD_POSTINIT_DRIVER_SHA256']:
                  raise SystemExit('post-init driver differs from the reviewed digest')
              path = Path(directory) / 'ci_postinit_shards.py'
              path.write_bytes(driver)
              result = subprocess.run([sys.executable, '-I', '-X', 'utf8', str(path), 'collect', '--repo-root', '.'])
          raise SystemExit(result.returncode)

      - name: Export Pages CI inventory
        if: ${{ matrix.role != 'win_contracts' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: python site/ci_inventory.py export --repo-root . --reports-dir "$RUNNER_TEMP/kdd-suite-reports" --output "$RUNNER_TEMP/kdd-pages-ci-inventory/inventory.json" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" --platform "${{ matrix.os }}" --trusted-runtime-ref "$KDD_TRUSTED_RUNTIME_REF"

      - name: Upload Pages CI inventory
        if: ${{ matrix.role != 'win_contracts' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-ci-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/kdd-pages-ci-inventory/inventory.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Approve project quality (when configured)
        if: ${{ matrix.role != 'win_contracts' }}
        id: quality
        shell: python
        env:
          KDD_QUALITY_POLICY: ${{ inputs.quality_policy_path || 'quality.json' }}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          policy = os.environ['KDD_QUALITY_POLICY']
          approved = os.environ['KDD_QUALITY_APPROVED_REF']
          strict = os.environ.get('KDD_QUALITY_REQUIRE_ORACLE_REVIEWS') == 'true'
          if strict or Path(policy).exists() or approved:
              if not re.fullmatch(r'[0-9a-fA-F]{40}', approved):
                  raise SystemExit('FAIL: project policy requires an explicitly approved reference (full commit SHA)')
              args = ['--repo-root', '.', '--policy', policy, '--approved-ref', approved]
              if strict:
                  args.append('--require-oracle-reviews')
              if strict:
                  with tempfile.TemporaryDirectory(prefix='kdd-approved-quality-') as directory:
                      runner = Path(directory) / 'verify_quality.py'
                      if runner.resolve().is_relative_to(Path.cwd().resolve()):
                          raise SystemExit('FAIL: the trusted runner must be outside the checkout')
                      runner.write_bytes(subprocess.check_output([
                          'git', '--no-replace-objects', 'show', approved + ':scripts/verify_quality.py']))
                      raise SystemExit(subprocess.call([sys.executable, '-I', str(runner), *args]))
              raise SystemExit(subprocess.call([sys.executable, 'scripts/verify_quality.py', *args]))
          print('SKIP: no project quality policy configured; template validation does not approve a project')

      - name: Verify required contract acceptance
        if: ${{ matrix.role != 'win_contracts' }}
        id: acceptance
        shell: python
        env:
          KDD_ACCEPTANCE_POLICY: ${{ inputs.acceptance_policy_path || 'acceptance.json' }}
          KDD_ACCEPTANCE_REQUIRED: ${{ inputs.acceptance_required || false }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          policy = os.environ['KDD_ACCEPTANCE_POLICY']
          required = os.environ['KDD_ACCEPTANCE_REQUIRED'].lower() == 'true'
          approved = os.environ['KDD_ACCEPTANCE_APPROVED_REF']
          approved_policy = subprocess.run(
              ['git', 'cat-file', '-e', approved + ':' + policy],
              capture_output=True, timeout=30).returncode == 0
          if required or approved_policy or Path(policy).exists():
              raise SystemExit(subprocess.call([
                  sys.executable, 'scripts/verify_acceptance.py', '--policy', policy,
                  '--approved-ref', approved,
                  '--json-output', str(Path(os.environ['RUNNER_TEMP']) / 'kdd-acceptance.json')]))
          print('SKIP: legacy project has no acceptance policy; acceptance is NOT_EVALUATED')

      - name: Upload acceptance matrix
        if: ${{ always() && matrix.role != 'win_contracts' && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/kdd-acceptance.json
          if-no-files-found: ignore

      - name: Summarize acceptance state
        if: ${{ always() && matrix.role != 'win_contracts' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'kdd-acceptance.json'
          state = json.loads(path.read_text())['state'] if path.exists() else 'NOT_EVALUATED'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\nAcceptance: `' + state + '`\n')

      - name: Assemble context (smoke)
        run: python scripts/assemble_context.py ccdd/context.json "smoke"

      - name: Summarize optional evidence
        if: always()
        env:
          KDD_SECURITY_OUTCOME: ${{ steps.security_scan.outcome }}
          KDD_COMPLIANCE_OUTCOME: ${{ steps.compliance_scan.outcome }}
          KDD_PRIVACY_OUTCOME: ${{ steps.privacy_scan.outcome }}
          KDD_ACCESSIBILITY_OUTCOME: ${{ steps.accessibility_scan.outcome }}
          KDD_DEPENDENCY_EOL_OUTCOME: ${{ steps.dependency_eol_scan.outcome }}
          KDD_OBSERVABILITY_OUTCOME: ${{ steps.observability_scan.outcome }}
          KDD_TEST_COVERAGE_OUTCOME: ${{ steps.test_coverage_scan.outcome }}
          KDD_QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: python scripts/optional_evidence.py summary --layers security,compliance,privacy,accessibility,dependency-eol,observability,test-coverage,quality

      - name: Run Windows Board typecheck
        if: ${{ matrix.role == 'win_contracts' }}
        run: npm run typecheck
        working-directory: tools/kdd-board
      - name: Run Windows Board tests
        if: ${{ matrix.role == 'win_contracts' }}
        run: npm test
        working-directory: tools/kdd-board

      - name: Create Windows validation receipt
        if: ${{ matrix.role == 'win_contracts' || matrix.role == 'win_suite' }}
        shell: bash
        env:
          KDD_WINDOWS_RECEIPT_ROLE: ${{ matrix.role == 'win_contracts' && 'contracts' || 'suites' }}
        run: python -I scripts/ci_windows_join.py produce --repo-root . --role "$KDD_WINDOWS_RECEIPT_ROLE"

      - name: Upload Windows validation receipt
        id: windows-receipt
        if: ${{ matrix.role == 'win_contracts' || matrix.role == 'win_suite' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-validation-receipt-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kdd-windows-receipts/receipt.json
          if-no-files-found: error
          overwrite: false

      - name: Export CI timing diagnostics
        id: ci-timings
        if: ${{ always() && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: bash
        run: >-
          python -I scripts/ci_timings.py export --repo-root .
          --commands-dir "$RUNNER_TEMP/kdd-command-reports"
          --suites-dir "$RUNNER_TEMP/kdd-suite-reports"
          --output "$RUNNER_TEMP/kdd-ci-timings/timings.json"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --head-sha "$GITHUB_SHA" --platform "${{ matrix.os }}"
          --trusted-runtime-ref "$KDD_TRUSTED_RUNTIME_REF"

      - name: Upload CI timing diagnostics
        if: ${{ always() && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' && steps.ci-timings.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.role != 'full' && format('kdd-timings-source-{0}-{1}-{2}', matrix.role, github.run_id, github.run_attempt) || format('kdd-timings-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.os) }}
          path: ${{ runner.temp }}/kdd-ci-timings/timings.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  board:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        exclude: ${{ fromJSON(github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"os":"windows-latest"}]' || '[]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: tools/kdd-board
      - run: npm run typecheck
        working-directory: tools/kdd-board
      - run: npm test
        working-directory: tools/kdd-board

  postinit_windows:
    if: >-
      ${{ github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref ==
      format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name
      == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: Windows post-init (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [0, 1]
    env:
      KDD_TRUSTED_RUNTIME_REF: ${{ inputs.trusted_runtime_ref || vars.KDD_TRUSTED_RUNTIME_REF || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      KDD_APPROVAL_REGISTRY: ${{ vars.KDD_APPROVAL_REGISTRY || '' }}
      KDD_EXPLICIT_APPROVED_BASELINE_REF: ${{ inputs.approved_baseline_ref || '' }}
      KDD_EXPLICIT_QUALITY_APPROVED_REF: ${{ inputs.quality_approved_ref || '' }}
      KDD_POSTINIT_QUALITY_POLICY: ${{ inputs.quality_policy_path || 'quality.json' }}
      KDD_POSTINIT_REQUIRED_EVIDENCE: ${{ inputs.required_evidence || '' }}
      KDD_POSTINIT_REQUIRE_ORACLE_REVIEWS: ${{ inputs.quality_require_oracle_reviews && 'true' || 'false' }}
      KDD_MCP_SDK_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11 for post-init
        id: postinit-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Bind Windows post-init tools
        id: postinit-tools
        shell: C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command "& $env:KDD_POSTINIT_PYTHON -I -X utf8 '{0}'; exit $LASTEXITCODE"
        working-directory: ${{ runner.temp }}
        env:
          KDD_POSTINIT_PYTHON: ${{ steps.postinit-python.outputs.python-path }}
        run: |
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if Path.cwd().resolve().is_relative_to(root):
              raise SystemExit('post-init tool capture requires an external directory')
          paths = [Path(value) for value in os.environ['PATH'].split(os.pathsep)]
          path = os.pathsep.join(str(folder) for folder in paths if folder.is_absolute()
                               and not folder.resolve().is_relative_to(root))
          git, gh = (Path(shutil.which(name, path=path)).resolve(strict=True) for name in ('git', 'gh'))
          home = git.parent.parent
          options = [home / layout / 'bin/git.exe' for layout in ('ucrt64', 'mingw64')]
          git = next((candidate.resolve() for candidate in options if candidate.is_file()), git)
          if any(executable.is_relative_to(root) for executable in (git, gh)):
              raise SystemExit('post-init tools must be installed outside the checkout')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'git={git}\ngh={gh}\npath={path}\n')

      - name: Select native Git on Windows for post-init
        if: ${{ runner.os == 'Windows' && !inputs.reusable_execution && github.repository == 'MauricioPerera/KDD' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import statistics
          import subprocess
          import time
          launcher = Path(shutil.which('git')).resolve()
          # Git for Windows 2.56 moved its native executable to ucrt64.
          # Older installations retain mingw64; both belong to this launcher.
          home = launcher.parent.parent
          candidates = [home / layout / 'bin' / 'git.exe' for layout in ('ucrt64', 'mingw64')]
          native = next((path for path in candidates if path.is_file()), launcher)
          version = subprocess.check_output([str(launcher), '--version'], text=True).strip()
          if subprocess.check_output([str(native), '--version'], text=True).strip() != version:
              raise SystemExit('FAIL: native Git must match the installed launcher version')
          startup = {}
          for label, executable in (('launcher', launcher), ('native', native)):
              samples = []
              for _ in range(7):
                  started = time.perf_counter()
                  subprocess.check_output([str(executable), '--version'])
                  samples.append(time.perf_counter() - started)
              startup[label] = {'median_seconds': statistics.median(samples), 'samples_seconds': samples}
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(native.parent) + '\n')
          print(json.dumps({'git_launcher': str(launcher), 'git_native': str(native), 'version': version, 'startup': startup}))

      - name: Select approved references for post-init
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from approval_registry import ApprovalError, resolve
          required = {item.strip() for item in os.environ['KDD_POSTINIT_REQUIRED_EVIDENCE'].split(',')}
          if os.environ.get('KDD_POSTINIT_REQUIRE_ORACLE_REVIEWS') == 'true':
              required.add('quality')
          try:
              selected = resolve(
                  '.', 'HEAD', os.environ['KDD_APPROVAL_REGISTRY'],
                  explicit_baseline=os.environ['KDD_EXPLICIT_APPROVED_BASELINE_REF'],
                  explicit_quality=os.environ['KDD_EXPLICIT_QUALITY_APPROVED_REF'],
                  require_quality='quality' in required or Path(os.environ.get('KDD_POSTINIT_QUALITY_POLICY', 'quality.json')).exists(),
              )
          except ApprovalError as error:
              raise SystemExit('FAIL: ' + str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_APPROVED_BASELINE_REF=' + selected['baseline_ref'] + '\n')
              output.write('KDD_ACCEPTANCE_APPROVED_REF=' + selected['baseline_ref'] + '\n')
              output.write('KDD_QUALITY_APPROVED_REF=' + (selected['quality_ref'] or '') + '\n')
          print(json.dumps(selected, sort_keys=True))

      - name: Materialize reviewed isolated CI runtime for post-init
        shell: python -I {0}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          root = Path.cwd().resolve()
          ref = os.environ['KDD_TRUSTED_RUNTIME_REF']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
              raise SystemExit('FAIL: trusted runtime requires a reviewed full commit SHA')
          ref = ref.lower()
          if subprocess.check_output(['git', 'cat-file', '-t', ref]).strip() != b'commit':
              raise SystemExit('FAIL: trusted runtime must be a commit')
          temporary = Path(tempfile.mkdtemp(prefix='kdd-ci-runtime-', dir=os.environ['RUNNER_TEMP'])).resolve()
          if temporary.is_relative_to(root):
              raise SystemExit('FAIL: the trusted runtime must be outside the checkout')
          entry = temporary / 'trusted_ci.py'
          entry.write_bytes(subprocess.check_output(['git', 'show', ref + ':scripts/trusted_ci.py']))
          bundle = temporary / 'bundle'
          subprocess.run([
              sys.executable, '-I', str(entry), 'prepare', '--repo-root', str(root),
              '--trusted-ref', ref, '--bundle-dir', str(bundle),
          ], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_TRUSTED_BUNDLE=' + bundle.as_posix() + '\n')
          print('Trusted CI runtime: ' + ref)

      - name: Install pinned change-audit parsers for post-init
        run: |
          python -m pip install --only-binary=:all: -r requirements-change-audit.txt

      - name: Install pinned context compatibility dependencies for post-init
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/context-v03/requirements.txt

      - name: Install pinned workflow checker for post-init
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'scripts/validate_workflows.py', 'install',
              '--cache-dir', str(Path(os.environ['RUNNER_TEMP']) / 'kdd-actionlint'),
              '--github-env', os.environ['GITHUB_ENV'],
              '--github-path', os.environ['GITHUB_PATH'],
          ], check=True)

      - name: Set up Node.js (for the multi-language example contract) for post-init
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install board dependencies for contract oracles (when present) for post-init
        if: ${{ hashFiles('tools/kdd-board/package-lock.json') != '' }}
        run: npm ci --ignore-scripts
        working-directory: tools/kdd-board

      - name: Prepare pinned MCP SDK environment for post-init
        if: ${{ env.KDD_MCP_SDK_REQUIRED == '1' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv
          root = Path.cwd().resolve()
          directory = Path(tempfile.mkdtemp(prefix='kdd-mcp-sdk-', dir=os.environ['RUNNER_TEMP'])).resolve()
          if directory.is_relative_to(root):
              raise SystemExit('FAIL: SDK environment must be outside the checkout')
          venv.EnvBuilder(with_pip=True).create(directory / 'venv')
          python = directory / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          platform = 'windows' if os.name == 'nt' else 'ubuntu'
          environment = dict(os.environ, PIP_CONFIG_FILE=os.devnull, PIP_INDEX_URL='https://pypi.org/simple',
                             PIP_EXTRA_INDEX_URL='', PIP_FIND_LINKS='', PIP_DISABLE_PIP_VERSION_CHECK='1')
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--only-binary=:all:',
                          '--require-hashes', '--index-url', 'https://pypi.org/simple',
                          '-r', str(root / 'tools/mcp-sdk' / (platform + '.txt'))],
                         env=environment, check=True, timeout=300)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KDD_MCP_SDK_PYTHON=' + python.as_posix() + '\n')
              output.write('KDD_MCP_SDK_REPORT=' + (directory / 'protocol-report.json').as_posix() + '\n')

      - name: Prepare native Windows test temp for post-init
        if: ${{ github.repository == 'MauricioPerera/KDD' && matrix.os == 'windows-latest' && !inputs.reusable_execution }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          root = Path.cwd().resolve(strict=True)
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if not base.is_dir() or base.is_relative_to(root) or any(c in str(base) for c in '\r\n'):
              raise SystemExit('RUNNER_TEMP must be an external directory')
          environment = dict(os.environ, LC_ALL='C')
          for name in ('GIT_DIR', 'GIT_WORK_TREE', 'GIT_COMMON_DIR', 'GIT_INDEX_FILE', 'GIT_CEILING_DIRECTORIES'):
              environment.pop(name, None)
          probe = subprocess.run(['git', '-C', str(base), 'rev-parse', '--is-inside-work-tree'],
                                 env=environment, capture_output=True)
          if probe.returncode != 128 or not probe.stderr.startswith(b'fatal: not a git repository'):
              raise SystemExit('RUNNER_TEMP must be outside Git; repository probe must succeed')
          directory = Path(tempfile.mkdtemp(prefix='kdd-native-tests-', dir=base)).resolve(strict=True)
          try:
              if directory.parent != base or directory.is_relative_to(root):
                  raise RuntimeError('Temporary directory escaped the reviewed location')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
                  output.write(''.join(name + '=' + directory.as_posix() + '\n' for name in ('TEMP', 'TMP', 'TMPDIR')))
          except BaseException:
              directory.rmdir()
              raise
          print('KDD_WINDOWS_TEMP ' + json.dumps({'runner_temp': base.as_posix(), 'test_temp': directory.as_posix()}))

      - name: Run post-init shard
        id: shard-command
        shell: C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command "& $env:KDD_POSTINIT_PYTHON -I -X utf8 '{0}'; exit $LASTEXITCODE"
        env:
          KDD_POSTINIT_PYTHON: ${{ steps.postinit-python.outputs.python-path }}
          KDD_POSTINIT_DRIVER_SHA256: '1b0fbea9cd310256f84c694b7d335602be10bc0377a29b007d919ddd62a7d05d'
          KDD_POSTINIT_GIT: ${{ steps.postinit-tools.outputs.git }}
          KDD_POSTINIT_GH: ${{ steps.postinit-tools.outputs.gh }}
          KDD_POSTINIT_TOOL_PATH: ${{ steps.postinit-tools.outputs.path }}
          KDD_POSTINIT_SHARD_INDEX: ${{ matrix.shard }}
          KDD_OBSERVE_POSTINIT: '1'
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if base.is_relative_to(Path.cwd().resolve()):
              raise SystemExit('post-init driver needs an external temporary directory')
          root = Path.cwd().resolve()
          git = Path(os.environ['KDD_POSTINIT_GIT'])
          if not git.is_absolute() or git.resolve().is_relative_to(root):
              raise SystemExit('post-init requires the bound Git')
          tool_env = {key: os.environ[key] for key in ('SYSTEMROOT', 'WINDIR', 'TMP', 'TEMP')
                      if key in os.environ}
          tool_env.update(PATH=os.environ['KDD_POSTINIT_TOOL_PATH'],
                          GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM='1')
          with tempfile.TemporaryDirectory(prefix='kdd-postinit-driver-', dir=base) as directory:
              driver = subprocess.check_output([str(git), '-C', str(root), '--no-replace-objects',
                                                'show', 'HEAD:scripts/ci_postinit_shards.py'],
                                               cwd=directory, env=tool_env, timeout=30)
              if hashlib.sha256(driver).hexdigest() != os.environ['KDD_POSTINIT_DRIVER_SHA256']:
                  raise SystemExit('post-init driver differs from the reviewed digest')
              path = Path(directory) / 'ci_postinit_shards.py'
              path.write_bytes(driver)
              result = subprocess.run([sys.executable, '-I', '-X', 'utf8', str(path), 'run', '--repo-root', '.', '--shard', os.environ['KDD_POSTINIT_SHARD_INDEX'],
                                   '--receipt', str(base / 'kdd-postinit-shard/receipt.json')])
          if result.returncode == 124:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('timed_out=true\n')
          raise SystemExit(result.returncode)

      - name: Upload post-init shard receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-postinit-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/kdd-postinit-shard/receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Collect Windows partition progress
        id: partition-observation
        if: ${{ always() && steps.shard-command.outputs.timed_out == 'true' }}
        shell: bash
        run: python -I scripts/postinit_timeout_observation.py --ci-output

      - name: Upload Windows partition progress
        if: ${{ always() && steps.partition-observation.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-postinit-progress-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/kdd-postinit-progress.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  validate_windows:
    if: ${{ github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: ${{ github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (matrix.role == 'win_contracts' && 'board (windows-latest)' || 'Windows validation work') || 'Windows validation inactive' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        role: [win_contracts, win_suite]
    runs-on: ${{ matrix.os }}
    env: *validation_environment
    steps: *validation_steps
    outputs:
      win_contract_id: ${{ matrix.role == 'win_contracts' && steps.windows-receipt.outputs.artifact-id || '' }}
      win_contract_digest: ${{ matrix.role == 'win_contracts' && steps.windows-receipt.outputs.artifact-digest || '' }}
      win_suite_id: ${{ matrix.role == 'win_suite' && steps.windows-receipt.outputs.artifact-id || '' }}
      win_suite_digest: ${{ matrix.role == 'win_suite' && steps.windows-receipt.outputs.artifact-digest || '' }}
      win_suite_inventory_sha256: ${{ matrix.role == 'win_suite' && steps.windows-suite-inventory.outputs.sha256 || '' }}
      win_coverage_id: ${{ matrix.role == 'win_suite' && steps.suite-coverage.outputs.artifact-id || '' }}
      win_coverage_digest: ${{ matrix.role == 'win_suite' && steps.suite-coverage.outputs.artifact-digest || '' }}

  require_windows:
    if: ${{ always() && github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: ${{ github.repository == 'MauricioPerera/KDD' && !inputs.reusable_execution && github.workflow_ref == format('{0}/.github/workflows/validate.yml@{1}', github.repository, github.ref) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'validate (windows-latest)' || 'Windows native verification (inactive)' }}
    needs: [validate_windows]
    runs-on: ubuntu-latest
    env:
      VALIDATION_STATE: ${{ needs.validate_windows.result }}
      CONTRACTS_ID: ${{ needs.validate_windows.outputs.win_contract_id }}
      CONTRACTS_DIGEST: ${{ needs.validate_windows.outputs.win_contract_digest }}
      SUITES_ID: ${{ needs.validate_windows.outputs.win_suite_id }}
      SUITES_DIGEST: ${{ needs.validate_windows.outputs.win_suite_digest }}
      COVERAGE_ID: ${{ needs.validate_windows.outputs.win_coverage_id }}
      COVERAGE_DIGEST: ${{ needs.validate_windows.outputs.win_coverage_digest }}
      KDD_SUITE_INVENTORY_SHA256: ${{ needs.validate_windows.outputs.win_suite_inventory_sha256 }}
      KDD_TRUSTED_RUNTIME_REF: ${{ inputs.trusted_runtime_ref || vars.KDD_TRUSTED_RUNTIME_REF || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
    steps:
      - name: Check Windows validation producers
        shell: bash
        run: |
          test "$VALIDATION_STATE" = success
          [[ "$CONTRACTS_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SUITES_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$COVERAGE_ID" =~ ^[1-9][0-9]*$ ]]
          test "$CONTRACTS_ID" != "$SUITES_ID"
          test "$COVERAGE_ID" != "$CONTRACTS_ID"
          test "$COVERAGE_ID" != "$SUITES_ID"
          [[ "$CONTRACTS_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SUITES_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$COVERAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$KDD_SUITE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: *validation_python
      - name: Materialize reviewed runtime for the Windows join
        shell: python -I {0}
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
        run: *materialize_validation_runtime
      - name: Download Windows validation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.validate_windows.outputs.win_contract_id }},${{ needs.validate_windows.outputs.win_suite_id }},${{ needs.validate_windows.outputs.win_coverage_id }}
          skip-decompress: true
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/kdd-windows-validation-artifacts
      - name: Verify Windows validation receipts
        shell: python -I {0}
        env:
          KDD_WINDOWS_JOIN_DRIVER_SHA256: 8321fcae3f33e43c7dc1e19f6968f1130d3530e02ce429ebf6d6a46bbbca7639
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          env = os.environ
          root = Path.cwd().resolve()
          sha = env['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Windows receipts require the full checkout SHA')

          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], timeout=15)

          if git('rev-parse', '--verify', 'HEAD').decode('ascii').strip() != sha:
              raise SystemExit('Windows receipts checkout mismatch')
          source = git('show', sha + ':scripts/ci_windows_join.py')
          if hashlib.sha256(source).hexdigest() != env['KDD_WINDOWS_JOIN_DRIVER_SHA256']:
              raise SystemExit('Windows receipt verifier digest mismatch')
          with tempfile.TemporaryDirectory(prefix='kdd-windows-join-', dir=env['RUNNER_TEMP']) as folder:
              work = Path(folder).resolve()
              if work.is_relative_to(root):
                  raise SystemExit('Windows receipt verifier must be outside checkout')
              driver = work / 'ci_windows_join.py'
              driver.write_bytes(source)
              run, attempt = env['GITHUB_RUN_ID'], env['GITHUB_RUN_ATTEMPT']
              identity = work / 'identity.json'
              producer = work / 'producers.json'
              identity.write_text(json.dumps({
                  'repository': env['GITHUB_REPOSITORY'],
                  'workflow': '.github/workflows/validate.yml',
                  'run_id': int(run), 'run_attempt': int(attempt),
                  'head_sha': sha, 'tree': git('rev-parse', sha + '^{tree}').decode('ascii').strip(),
                  'runtime_ref': env['KDD_TRUSTED_RUNTIME_REF'], 'platform': 'windows-latest',
              }), encoding='utf-8')
              producer.write_text(json.dumps({
                  name.lower(): {'id': int(env[name + '_ID']), 'digest': env[name + '_DIGEST'],
                                 'result': env['VALIDATION_STATE']}
                  for name in ('CONTRACTS', 'SUITES', 'COVERAGE')
              }), encoding='utf-8')
              artifacts = Path(env['RUNNER_TEMP']) / 'kdd-windows-validation-artifacts'
              subprocess.run([
                  sys.executable, '-I', str(driver), 'verify', '--repo-root', str(root),
                  '--runtime-bundle', env['KDD_TRUSTED_BUNDLE'],
                  '--identity', str(identity), '--producers', str(producer),
                  '--suite-inventory-sha256', env['KDD_SUITE_INVENTORY_SHA256'],
                  '--contracts', str(artifacts / f'kdd-validation-receipt-win_contracts-{run}-{attempt}.zip'),
                  '--suites', str(artifacts / f'kdd-validation-receipt-win_suite-{run}-{attempt}.zip'),
                  '--coverage', str(artifacts / f'kdd-coverage-{run}-{attempt}-windows-latest.zip'),
                  '--timings-output', str(Path(env['RUNNER_TEMP']) / 'kdd-ci-timings/timings.json'),
              ], check=True, timeout=120)
      - name: Upload joined Windows timing diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdd-timings-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest
          path: ${{ runner.temp }}/kdd-ci-timings/timings.json
          if-no-files-found: error
          overwrite: false
