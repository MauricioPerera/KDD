name: KDD validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate the selected contracts
        shell: python -I {0}
        env:
          KDD_ADOPTION_APPROVED_REF: ${{ vars.KDD_ADOPTION_APPROVED_REF }}
          KDD_QUALITY_APPROVED_REF: ${{ vars.KDD_QUALITY_APPROVED_REF }}
        run: |
          from contextlib import chdir
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          reference = os.environ["KDD_ADOPTION_APPROVED_REF"]
          name = ".kdd/validate.py"
          if (reference or os.environ["GITHUB_EVENT_NAME"] == "pull_request") and not re.fullmatch(
              r"[0-9a-f]{40}", reference
          ):
              raise SystemExit("KDD_ADOPTION_APPROVED_REF must identify a full approved consumer commit")

          env = {key: value for key, value in os.environ.items() if not key.upper().startswith("GIT_")}
          paths = [entry for entry in os.get_exec_path(env)
                   if Path(entry).is_absolute() and not Path(entry).resolve().is_relative_to(root)]
          env.update(PATH=os.pathsep.join(paths), GIT_CONFIG_NOSYSTEM="1",
                     GIT_CONFIG_GLOBAL=os.devnull, GIT_TERMINAL_PROMPT="0", GIT_NO_REPLACE_OBJECTS="1")
          git = ["git", "--no-replace-objects", "--literal-pathspecs", "-C", str(root)]

          def read_git(*args):
              return subprocess.check_output([*git, *args], env=env, timeout=30)

          def approved_launcher(directory):
              actual = read_git("rev-parse", "--verify", reference + "^{commit}").decode("ascii").strip()
              if actual != reference:
                  raise SystemExit("The approved adoption reference must identify the exact commit")
              ancestor = subprocess.run([*git, "merge-base", "--is-ancestor", reference, "HEAD"],
                                        env=env, timeout=30, check=False)
              if ancestor.returncode:
                  raise SystemExit("The approved adoption commit must be an ancestor of the candidate")
              entry = read_git("ls-tree", "-z", reference, "--", name)
              if not re.fullmatch(rb"100(?:644|755) blob [0-9a-f]{40}\t\.kdd/validate\.py\0", entry):
                  raise SystemExit("Missing regular approved " + name)
              path = directory / "validate.py"
              with path.open("xb") as stream:
                  stream.write(read_git("show", reference + ":" + name))
              return path

          with tempfile.TemporaryDirectory(prefix="kdd-adoption-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              directory = Path(temporary).resolve()
              if directory.is_relative_to(root):
                  raise SystemExit("The launcher temporary directory must be outside the checkout")
              with chdir(directory):
                  if read_git("rev-parse", "--verify", "HEAD").decode("ascii").strip() != os.environ["GITHUB_SHA"]:
                      raise SystemExit("Checkout does not match the event commit")
                  launcher = approved_launcher(directory) if reference else root / name
                  result = subprocess.run([sys.executable, "-I", str(launcher), "--repo-root", str(root),
                                           "--approved-ref", reference], env=env, check=False)
              raise SystemExit(result.returncode)
